<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none">
  <defs>
    <linearGradient id="logoFlowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(6, 6) scale(0.58)">
    <rect width="100" height="100" rx="22" fill="url(#logoFlowGradient)" />
    <!-- Vertical Stem -->
    <path
      d="M 28 26 C 28 22.5 30.5 20 34 20 C 37.5 20 40 22.5 40 26 L 40 74 C 40 77.5 37.5 80 34 80 C 30.5 80 28 77.5 28 74 Z"
      fill="#FFFFFF"
    />
    <!-- Wave Arm -->
    <path
      d="M 34 20 C 46 20 54 22 64 26 C 68 27.6 72 30 74 34 C 75.5 37 72.5 40 69 39 C 64 37.5 58 35 48 35 L 34 35 Z"
      fill="#FFFFFF"
    />
    <!-- Middle Arm -->
    <path
      d="M 34 47 C 42 47 50 47 56 47 C 59.5 47 62 49.5 62 53 C 62 56.5 59.5 59 56 59 C 50 59 42 59 34 59 Z"
      fill="#FFFFFF"
    />
    <!-- Person Dot -->
    <circle cx="75" cy="53" r="6.5" fill="#FFFFFF" />
  </g>

  <!-- Typography: Flowpeople -->
  <text x="78" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#111827">Flow</tspan><tspan fill="#4F46E5">people</tspan>
  </text>

  <!-- Subtitle: BY FLUXORA -->
  <text x="80" y="55" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#6B7280" letter-spacing="3.2">
    BY FLUXORA
  </text>
</svg>

